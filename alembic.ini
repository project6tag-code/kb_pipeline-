# Alembic configuration for the KB pipeline's kbp schema ONLY.
#
# No database URL is stored here. env.py reads KB_MIGRATION_DATABASE_URL from
# the environment (see .env.example). The version table is kbp.alembic_version
# (configured in app/db/migration_config.py); public.alembic_version belongs to
# the legacy system and is never used.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
